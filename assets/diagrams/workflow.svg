<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Sprite editing workflow</title><desc id="desc">Five-step pipeline from loading a PNG through auto-detection, editing, normalization, and export.</desc>
<style>.bg{fill:#fafafa}.card{fill:#fff;stroke:#d4d4d8;stroke-width:2}.text{fill:#18181b;font:650 19px system-ui,sans-serif}.num{fill:#6366f1;font:700 13px system-ui,sans-serif}.link{stroke:#6366f1;stroke-width:4;stroke-dasharray:8 7;marker-end:url(#a);animation:dash 7s linear infinite}.ico{fill:none;stroke:#6366f1;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.active{animation:pulse 2.5s ease-in-out infinite}.fade{animation:fade .8s ease both}@keyframes dash{to{stroke-dashoffset:-100}}@keyframes pulse{50%{filter:drop-shadow(0 0 8px #22d3ee)}}@keyframes fade{from{opacity:0}to{opacity:1}}@media(prefers-color-scheme:dark){.bg{fill:#18181b}.card{fill:#27272a;stroke:#52525b}.text{fill:#fafafa}}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#22d3ee"/></marker></defs><rect class="bg" width="1200" height="400"/><text class="text" x="600" y="54" text-anchor="middle" font-size="27">From sprite sheet to ready-to-use assets</text>
<g class="fade"><rect class="card" x="24" y="116" width="204" height="220" rx="18"/><text class="num" x="48" y="150">01</text><path class="ico" d="M92 181h66v62H92zM106 166h66v62M111 213l15-16 13 12 10-8 15 18"/><text class="text" x="126" y="292" text-anchor="middle">Load PNG</text>
<rect class="card active" x="264" y="116" width="204" height="220" rx="18"/><text class="num" x="288" y="150">02</text><circle class="ico" cx="354" cy="205" r="36"/><path class="ico" d="M381 232l24 24M331 205h46M354 182v46"/><text class="text" x="366" y="292" text-anchor="middle">Auto-detect</text>
<rect class="card" x="504" y="116" width="204" height="220" rx="18"/><text class="num" x="528" y="150">03</text><path class="ico" d="M552 176h72v58h-72zM576 176v58M600 176v58M552 195h72M552 215h72M641 181l15 15-15 15"/><text class="text" x="606" y="292" text-anchor="middle">Edit frames</text>
<rect class="card" x="744" y="116" width="204" height="220" rx="18"/><text class="num" x="768" y="150">04</text><path class="ico" d="M786 179h72v54h-72zM800 193h44M800 206h44M800 219h30M869 188l8 8 14-16"/><text class="text" x="846" y="292" text-anchor="middle">Normalize</text>
<rect class="card" x="984" y="116" width="192" height="220" rx="18"/><text class="num" x="1008" y="150">05</text><path class="ico" d="M1051 171v52m-20-20 20 20 20-20M1024 239h54v17h-54z"/><text class="text" x="1080" y="292" text-anchor="middle">Export</text></g>
<path class="link" d="M228 226h27M468 226h27M708 226h27M948 226h27"/>
</svg>
