<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" viewBox="0 0 1024 600">
    <title id="title">Pet animation state machine</title>
    <desc id="desc">
        Future animation state model with idle, walk, drag, click stages, smoke, hidden and respawn states.
    </desc>
    <style>
        <![CDATA[@keyframes dash{to{stroke-dashoffset:-110}}@keyframes pulse{50%{filter:drop-shadow(0 0 7px #22d3ee)}}@keyframes fade{0%{opacity:0}to{opacity:1}}.node{fill:#fff;stroke:#6366f1;stroke-width:2}.t{fill:#18181b;font:650 14px system-ui,sans-serif}.label{fill:#52525b;font:12px system-ui,sans-serif}.edge{fill:none;stroke:#6366f1;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#a);animation:dash 8s linear infinite}@media (prefers-color-scheme:dark){svg>path:first-of-type{fill:#18181b!important}.node{fill:#27272a;stroke:#6366f1}.t{fill:#fafafa}.label{fill:#d4d4d8}}]]>
    </style>
    <defs>
        <marker id="a" markerHeight="7" markerWidth="7" orient="auto" refX="6" refY="3.5">
            <path fill="#22d3ee" d="m0 0 7 3.5L0 7z"/>
        </marker>
    </defs>
    <path d="M0 0h1024v600H0z" style="fill:#fafafa"/>
    <text x="40" y="42" class="t" font-size="24">Pet animation · future state model</text>
    <g style="animation:fade .8s ease both">
        <rect width="130" height="54" x="80" y="100" class="node" rx="22" style="animation:pulse 2.5s ease-in-out infinite"/>
        <text x="145" y="133" class="t" text-anchor="middle">idle</text>
        <rect width="130" height="54" x="330" y="100" class="node" rx="22"/>
        <text x="395" y="133" class="t" text-anchor="middle">walk</text>
        <rect width="130" height="54" x="580" y="100" class="node" rx="22"/>
        <text x="645" y="133" class="t" text-anchor="middle">drag</text>
        <rect width="130" height="54" x="840" y="170" class="node" rx="22"/>
        <text x="905" y="203" class="t" text-anchor="middle">drop</text>
        <rect width="130" height="54" x="80" y="250" class="node" rx="22"/>
        <text x="145" y="283" class="t" text-anchor="middle">click_1</text>
        <rect width="130" height="54" x="280" y="250" class="node" rx="22"/>
        <text x="345" y="283" class="t" text-anchor="middle">click_2</text>
        <rect width="130" height="54" x="480" y="250" class="node" rx="22"/>
        <text x="545" y="283" class="t" text-anchor="middle">click_3</text>
        <rect width="130" height="54" x="680" y="250" class="node" rx="22"/>
        <text x="745" y="283" class="t" text-anchor="middle">click_max</text>
        <rect width="150" height="54" x="680" y="410" class="node" rx="22"/>
        <text x="755" y="443" class="t" text-anchor="middle">smoke_throw</text>
        <rect width="150" height="54" x="450" y="410" class="node" rx="22"/>
        <text x="525" y="443" class="t" text-anchor="middle">smoke_vanish</text>
        <rect width="130" height="54" x="220" y="410" class="node" rx="22"/>
        <text x="285" y="443" class="t" text-anchor="middle">hidden</text>
        <rect width="140" height="54" x="60" y="500" class="node" rx="22"/>
        <text x="130" y="533" class="t" text-anchor="middle">respawn</text>
        <path d="M210 127h112" class="edge"/>
        <text x="266" y="116" class="label" text-anchor="middle">timer</text>
        <path d="M460 127h112" class="edge"/>
        <text x="516" y="116" class="label" text-anchor="middle">pointer down</text>
        <path d="M395 100c0-44-250-44-250 0" class="edge"/>
        <text x="270" y="68" class="label" text-anchor="middle">idle timeout</text>
        <path d="M710 127c55 0 75 43 130 56" class="edge"/>
        <text x="780" y="145" class="label" text-anchor="middle">mouse release</text>
        <path d="M840 210c-140 40-440 10-630-65" class="edge"/>
        <text x="525" y="226" class="label" text-anchor="middle">landed</text>
        <path d="M145 154v86" class="edge"/>
        <text x="157" y="204" class="label">click</text>
        <path d="M210 277h62" class="edge"/>
        <text x="241" y="263" class="label" text-anchor="middle">click</text>
        <path d="M410 277h62" class="edge"/>
        <text x="441" y="263" class="label" text-anchor="middle">click</text>
        <path d="M610 277h62" class="edge"/>
        <text x="641" y="263" class="label" text-anchor="middle">click</text>
        <path d="M745 304v98" class="edge"/>
        <text x="759" y="363" class="label">max reached</text>
        <path d="M680 437h-72" class="edge"/>
        <text x="644" y="425" class="label">burst</text>
        <path d="M450 437h-92" class="edge"/>
        <text x="404" y="425" class="label">vanished</text>
        <path d="m240 464-78 32" class="edge"/>
        <text x="182" y="474" class="label">respawn timer</text>
        <path d="M120 500c-60-70-60-322-30-356" class="edge"/>
        <text x="28" y="330" class="label" transform="rotate(-90 28 330)">visible again</text>
    </g>
</svg>
