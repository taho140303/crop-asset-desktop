<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" role="img" aria-labelledby="title desc">
<title id="title">Pet animation state machine</title><desc id="desc">Future animation state model with idle, walk, drag, click stages, smoke, hidden and respawn states.</desc>
<style>.bg{fill:#fafafa}.node{fill:#fff;stroke:#6366f1;stroke-width:2}.t{fill:#18181b;font:650 14px system-ui,sans-serif}.label{fill:#52525b;font:12px system-ui,sans-serif}.edge{fill:none;stroke:#6366f1;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#a);animation:dash 8s linear infinite}.current{animation:pulse 2.5s ease-in-out infinite}.fade{animation:fade .8s ease both}@keyframes dash{to{stroke-dashoffset:-110}}@keyframes pulse{50%{filter:drop-shadow(0 0 7px #22d3ee)}}@keyframes fade{from{opacity:0}to{opacity:1}}@media(prefers-color-scheme:dark){.bg{fill:#18181b}.node{fill:#27272a;stroke:#6366f1}.t{fill:#fafafa}.label{fill:#d4d4d8}}</style><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0l7 3.5-7 3.5z" fill="#22d3ee"/></marker></defs><rect class="bg" width="1024" height="600"/><text class="t" x="40" y="42" font-size="24">Pet animation · future state model</text>
<g class="fade"><rect class="node current" x="80" y="100" width="130" height="54" rx="22"/><text class="t" x="145" y="133" text-anchor="middle">idle</text><rect class="node" x="330" y="100" width="130" height="54" rx="22"/><text class="t" x="395" y="133" text-anchor="middle">walk</text><rect class="node" x="580" y="100" width="130" height="54" rx="22"/><text class="t" x="645" y="133" text-anchor="middle">drag</text>
<rect class="node" x="80" y="250" width="130" height="54" rx="22"/><text class="t" x="145" y="283" text-anchor="middle">click_1</text><rect class="node" x="280" y="250" width="130" height="54" rx="22"/><text class="t" x="345" y="283" text-anchor="middle">click_2</text><rect class="node" x="480" y="250" width="130" height="54" rx="22"/><text class="t" x="545" y="283" text-anchor="middle">click_3</text><rect class="node" x="680" y="250" width="130" height="54" rx="22"/><text class="t" x="745" y="283" text-anchor="middle">click_max</text>
<rect class="node" x="680" y="410" width="150" height="54" rx="22"/><text class="t" x="755" y="443" text-anchor="middle">smoke_throw</text><rect class="node" x="450" y="410" width="150" height="54" rx="22"/><text class="t" x="525" y="443" text-anchor="middle">smoke_vanish</text><rect class="node" x="220" y="410" width="130" height="54" rx="22"/><text class="t" x="285" y="443" text-anchor="middle">hidden</text><rect class="node" x="60" y="500" width="140" height="54" rx="22"/><text class="t" x="130" y="533" text-anchor="middle">respawn</text>
<path class="edge" d="M210 127h112"/><text class="label" x="266" y="116" text-anchor="middle">timer</text><path class="edge" d="M460 127h112"/><text class="label" x="516" y="116" text-anchor="middle">pointer down</text><path class="edge" d="M580 154C510 205 290 203 210 154"/><text class="label" x="400" y="194" text-anchor="middle">release</text>
<path class="edge" d="M145 154v86"/><text class="label" x="157" y="204">click</text><path class="edge" d="M210 277h62"/><text class="label" x="241" y="263" text-anchor="middle">click</text><path class="edge" d="M410 277h62"/><text class="label" x="441" y="263" text-anchor="middle">click</text><path class="edge" d="M610 277h62"/><text class="label" x="641" y="263" text-anchor="middle">click</text>
<path class="edge" d="M745 304v98"/><text class="label" x="759" y="363">max reached</text><path class="edge" d="M680 437h-72"/><text class="label" x="644" y="425">smoke ends</text><path class="edge" d="M450 437h-92"/><text class="label" x="404" y="425">vanished</text><path class="edge" d="M240 464l-78 32"/><text class="label" x="182" y="474">respawn timer</text><path class="edge" d="M88 500C14 430 26 178 79 144"/><text class="label" x="28" y="330" transform="rotate(-90 28 330)">visible again</text></g>
</svg>
