<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" role="img" aria-labelledby="title desc">
<title id="title">Sprite Cropper architecture</title><desc id="desc">React interface components flow through Zustand stores and Tauri invoke to Rust filesystem commands and output.</desc>
<style>
:root{color-scheme:light dark}.bg{fill:#fafafa}.panel{fill:#fff;stroke:#d4d4d8}.box{fill:#fff;stroke:#6366f1;stroke-width:2}.accent{fill:#6366f1}.cyan{fill:#22d3ee}.text{fill:#18181b;font:600 17px system-ui,sans-serif}.small{font:500 13px system-ui,sans-serif}.label{fill:#52525b;font:700 12px system-ui,sans-serif;letter-spacing:1.2px}.line{fill:none;stroke:#6366f1;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#arrow);animation:dash 8s linear infinite}.node{animation:pulse 2.4s ease-in-out infinite}.fade{animation:fade .8s ease both}@keyframes pulse{50%{filter:drop-shadow(0 0 7px #22d3ee)}}@keyframes dash{to{stroke-dashoffset:-120}}@keyframes fade{from{opacity:0}to{opacity:1}}@media(prefers-color-scheme:dark){.bg{fill:#18181b}.panel,.box{fill:#27272a;stroke:#6366f1}.text{fill:#fafafa}.small,.label{fill:#d4d4d8}}
</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#22d3ee"/></marker></defs>
<rect class="bg" width="1024" height="600"/><text class="text" x="48" y="48" font-size="24">Application architecture</text>
<rect class="panel fade" x="38" y="78" width="948" height="206" rx="18"/><text class="label" x="60" y="108">REACT UI</text><rect class="box" x="58" y="153" width="126" height="66" rx="10"/><text class="text" x="121" y="192" text-anchor="middle">Sidebar</text><rect class="box" x="198" y="153" width="126" height="66" rx="10"/><text class="text" x="261" y="192" text-anchor="middle">Canvas</text><rect class="box" x="338" y="153" width="126" height="66" rx="10"/><text class="text" x="401" y="192" text-anchor="middle">Inspector</text><rect class="box" x="526" y="153" width="170" height="66" rx="10"/><text class="text" x="611" y="192" text-anchor="middle">Zustand stores</text><rect class="box" x="754" y="153" width="170" height="66" rx="10"/><text class="text" x="839" y="192" text-anchor="middle">Tauri invoke</text>
<path class="line" d="M184 186h8"/><path class="line" d="M324 186h8"/><path class="line" d="M464 186h54"/><path class="line" d="M696 186h50"/><text class="small" x="611" y="239" text-anchor="middle">selection · frames · settings</text>
<path class="line" d="M750 246v72"/><text class="small" x="768" y="292">command request</text>
<rect class="panel fade" x="38" y="336" width="948" height="222" rx="18"/><text class="label" x="60" y="366">TAURI BRIDGE ↔ RUST BACKEND</text>
<rect class="box node" x="92" y="410" width="250" height="98" rx="12"/><text class="text" x="217" y="451" text-anchor="middle">Rust FS commands</text><text class="small" x="217" y="477" text-anchor="middle">read · write · export</text>
<rect class="box" x="682" y="410" width="250" height="98" rx="12"/><text class="text" x="807" y="451" text-anchor="middle">Output</text><text class="small" x="807" y="477" text-anchor="middle">sprite sheets · metadata</text><path class="line" d="M342 459h332"/><text class="small" x="508" y="444" text-anchor="middle">filesystem results</text>
</svg>
