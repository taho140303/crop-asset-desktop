<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" viewBox="0 0 800 500">
    <title id="title">Sprite Cropper features</title>
    <desc id="desc">
        Six capabilities: auto-detect, manual edit, normalize, preview, export, and batch-ready.
    </desc>
    <style>
        <![CDATA[@keyframes pulse{50%{filter:drop-shadow(0 0 8px #22d3ee)}}@keyframes dash{to{stroke-dashoffset:-80}}@keyframes fade{0%{opacity:0}to{opacity:1}}.dash{fill:none;stroke:#22d3ee;stroke-width:3;stroke-dasharray:5 5;marker-end:url(#arr);animation:dash 5s linear infinite}.card{fill:#fff;stroke:#d4d4d8;stroke-width:2}.text{fill:#18181b;font:650 17px system-ui,sans-serif}.ico{fill:none;stroke:#6366f1;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}@media (prefers-color-scheme:dark){svg>path:first-of-type{fill:#18181b!important}.card{fill:#27272a;stroke:#52525b}.text{fill:#fafafa}}]]>
    </style>
    <defs>
        <marker id="arr" markerHeight="7" markerWidth="7" orient="auto" refX="6" refY="3.5">
            <path fill="#22d3ee" d="m0 0 7 3.5L0 7z"/>
        </marker>
    </defs>
    <path d="M0 0h800v500H0z" style="fill:#fafafa"/>
    <text x="400" y="48" class="text" font-size="26" text-anchor="middle">Made for sprite workflows</text>
    <g style="animation:fade .8s ease both">
        <rect width="224" height="164" x="42" y="88" class="card" rx="18" style="animation:pulse 2.6s ease-in-out infinite"/>
        <circle cx="154" cy="145" r="27" class="ico"/>
        <path d="m174 165 18 18m-54-38h32m-16-16v32" class="ico"/>
        <text x="154" y="221" class="text" text-anchor="middle">Auto-detect</text>
        <rect width="224" height="164" x="288" y="88" class="card" rx="18"/>
        <path d="M360 119h60v52h-60zm20 0v52m20-52v52m-40-35h60m-60 17h60m14-29 14 14-14 14" class="ico"/>
        <text x="400" y="221" class="text" text-anchor="middle">Manual edit</text>
        <rect width="224" height="164" x="534" y="88" class="card" rx="18"/>
        <path d="M586 120h84v54h-84zm15 15h53m-53 13h53m-53 13h34m47-29 9 9 16-19" class="ico"/>
        <text x="646" y="221" class="text" text-anchor="middle">Normalize</text>
        <rect width="224" height="164" x="42" y="276" class="card" rx="18"/>
        <path d="M105 320h84v58h-84zm14 46 18-19 14 12 12-11 14 18" class="ico"/>
        <circle cx="169" cy="334" r="5" fill="#22d3ee"/>
        <text x="154" y="410" class="text" text-anchor="middle">Preview</text>
        <rect width="224" height="164" x="288" y="276" class="card" rx="18"/>
        <path d="M400 308v55m-21-21 21 21 21-21m-56 35h70v18h-70z" class="ico"/>
        <text x="400" y="421" class="text" text-anchor="middle">Export</text>
        <rect width="224" height="164" x="534" y="276" class="card" rx="18"/>
        <path d="M596 319h44v40h-44zm14-12h44v40m-30-52h44v40m-64-3h27m-27 12h19" class="ico"/>
        <text x="646" y="410" class="text" text-anchor="middle">Batch-ready</text>
        <path d="M266 170h22" class="dash"/>
        <path d="M512 170h22" class="dash"/>
        <path d="M646 252c0 12-492 12-492 24" class="dash"/>
        <path d="M266 358h22" class="dash"/>
        <path d="M512 358h22" class="dash"/>
    </g>
</svg>
