<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">Sprite Cropper features</title><desc id="desc">Six capabilities: auto-detect, manual edit, normalize, preview, export, and batch-ready.</desc>
<style>.bg{fill:#fafafa}.card{fill:#fff;stroke:#d4d4d8;stroke-width:2}.text{fill:#18181b;font:650 17px system-ui,sans-serif}.ico{fill:none;stroke:#6366f1;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.active{animation:pulse 2.6s ease-in-out infinite}.fade{animation:fade .8s ease both}.dash{fill:none;stroke:#22d3ee;stroke-width:3;stroke-dasharray:5 5;marker-end:url(#arr);animation:dash 5s linear infinite}@keyframes pulse{50%{filter:drop-shadow(0 0 8px #22d3ee)}}@keyframes dash{to{stroke-dashoffset:-80}}@keyframes fade{from{opacity:0}to{opacity:1}}@media(prefers-color-scheme:dark){.bg{fill:#18181b}.card{fill:#27272a;stroke:#52525b}.text{fill:#fafafa}}</style><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0l7 3.5-7 3.5z" fill="#22d3ee"/></marker></defs><rect class="bg" width="800" height="500"/><text class="text" x="400" y="48" text-anchor="middle" font-size="26">Made for sprite workflows</text>
<g class="fade"><rect class="card active" x="42" y="88" width="224" height="164" rx="18"/><path class="dash" d="M267 170h15M513 170h15"/><circle class="ico" cx="154" cy="145" r="27"/><path class="ico" d="M174 165l18 18M138 145h32M154 129v32"/><text class="text" x="154" y="221" text-anchor="middle">Auto-detect</text>
<rect class="card" x="288" y="88" width="224" height="164" rx="18"/><path class="ico" d="M360 119h60v52h-60zM380 119v52M400 119v52M360 136h60M360 153h60M434 124l14 14-14 14"/><text class="text" x="400" y="221" text-anchor="middle">Manual edit</text>
<rect class="card" x="534" y="88" width="224" height="164" rx="18"/><path class="ico" d="M586 120h84v54h-84zM601 135h53M601 148h53M601 161h34M682 132l9 9 16-19"/><text class="text" x="646" y="221" text-anchor="middle">Normalize</text>
<rect class="card" x="42" y="276" width="224" height="164" rx="18"/><path class="ico" d="M105 320h84v58h-84zM119 366l18-19 14 12 12-11 14 18"/><circle cx="169" cy="334" r="5" fill="#22d3ee"/><text class="text" x="154" y="410" text-anchor="middle">Preview</text>
<rect class="card" x="288" y="276" width="224" height="164" rx="18"/><path class="ico" d="M400 308v55m-21-21 21 21 21-21M365 377h70v18h-70z"/><text class="text" x="400" y="421" text-anchor="middle">Export</text>
<rect class="card" x="534" y="276" width="224" height="164" rx="18"/><path class="ico" d="M596 319h44v40h-44zM610 307h44v40M624 295h44v40M604 332h27M604 344h19"/><text class="text" x="646" y="410" text-anchor="middle">Batch-ready</text></g></svg>
