name: Lint

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    name: Prettier and Markdown lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check formatting with Prettier
        run: npx --yes prettier@3.6.2 --check "**/*.{md,json,yml,yaml}"
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.17.2 "**/*.md"
