name: Lint (informational)

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    name: Prettier and Markdown lint (warning only)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check formatting with Prettier
        run: npx --yes prettier@3.6.2 --check "**/*.{md,json,yml,yaml}"
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.17.2 "**/*.md"
